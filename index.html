  <script>
    // Samsung Internet wraps installed web apps in an Android package that Google Play Protect
    // blocks as "built for an older version of Android". Without a manifest it adds a plain
    // home-screen shortcut instead. Every other browser gets the manifest and full install.
    if (!/SamsungBrowser/i.test(navigator.userAgent)) {
      var mf = document.createElement('link');
      mf.rel = 'manifest';
      mf.href = 'manifest.webmanifest';
      document.head.appendChild(mf);
    }
    // Apply the saved theme and Simple view before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('oct26:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      if (JSON.parse(localStorage.getItem('oct26:simple')) === true) document.documentElement.classList.add('simple');
    } catch (e) { /* storage unavailable */ }
  </script>
